name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Download the public data (Kenneth French data library)
        run: uv run python scripts/fetch_data.py
      - run: uv run pytest
      - name: Smoke run of reproduce
        run: uv run python scripts/reproduce.py --fast
